name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'apk-native-ui.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub ubuntu-latest runners already provide Android SDK.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - name: Install dependencies
        run: npm install
      - name: Copy web app
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp apk-native-ui.js www/apk-native-ui.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text()
          s=s.replace('</body>', '<script src="./apk-native-ui.js"></script></body>')
          p.write_text(s)
          PY
      - name: Create and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Enable Android notification permissions
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: class-progress-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish downloadable APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk#class-progress-debug.apk \
            --title "수업진도 APK 빌드 ${{ github.run_number }}" \
            --notes "테스트용 Android APK입니다. 기존 설치본을 유지한 채 업데이트할 수 있습니다. Android 로컬 수업 알림 예약 기능을 포함합니다. 알림 및 정확한 알람 권한을 허용하세요." \
            --latest
