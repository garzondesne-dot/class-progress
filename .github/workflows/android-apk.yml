name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/jindonote-dark-topic, feature/jindonote-ui-polish]
    paths:
      - 'index.html'
      - 'apk-native-ui.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
      - 'android-template/**'
      - 'assets/**'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub ubuntu-latest runners already provide Android SDK.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - name: Install dependencies
        run: npm install
      - name: Validate application
        run: node identity.test.mjs
      - name: Compile offline styles
        run: |
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > utilities-input.css
          npx tailwindcss -i utilities-input.css -o utilities.css --content index.html --minify
      - name: Download bundled offline assets
        run: |
          curl -fL --retry 3 https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js -o lucide.min.js
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js -o xlsx.full.min.js
      - name: Copy web app
        run: |
          mkdir -p www/assets
          cp assets/jindonote-icon.svg www/assets/
          cp index.html www/index.html
          cp apk-native-ui.js www/apk-native-ui.js
          cp firebase-messaging-sw.js www/firebase-messaging-sw.js
          cp lucide.min.js xlsx.full.min.js www/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text()
          s=s.replace('<script src="https://cdn.tailwindcss.com"></script>', '<style>'+Path('utilities.css').read_text()+'</style>')
          s=s.replace('https://unpkg.com/lucide@latest', './lucide.min.js').replace('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','./xlsx.full.min.js')
          s=s.replace('</body>', '<script src="./apk-native-ui.js"></script></body>')
          p.write_text(s)
          PY
      - name: Create and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply native system bar layout
        run: |
          cp android-template/MainActivity.java android/app/src/main/java/io/github/garzondesnedot/classprogress/connected/MainActivity.java
      - name: Generate launcher icons
        run: |
          python -m pip install cairosvg
          python - <<'PYICON'
          import cairosvg, os, shutil
          # Remove generated adaptive icon XML, which otherwise overrides the PNGs.
          shutil.rmtree('android/app/src/main/res/mipmap-anydpi-v26', ignore_errors=True)
          for folder,size in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
              path='android/app/src/main/res/'+folder
              os.makedirs(path,exist_ok=True)
              for filename in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  cairosvg.svg2png(url='assets/jindonote-icon.svg',write_to=path+'/'+filename,output_width=size,output_height=size)
          PYICON
      - name: Enable Android notification permissions
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' android/app/src/main/AndroidManifest.xml
      - name: Add notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_notification.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M9,16.2L4.8,12l-1.4,1.4L9,19L21,7l-1.4,-1.4z"/></vector>
          XML
      - name: Configure persistent release signing
        if: github.ref == 'refs/heads/main'
        env:
          JINDONOTE_KEYSTORE_BASE64: ${{ secrets.JINDONOTE_KEYSTORE_BASE64 }}
          JINDONOTE_KEYSTORE_PASSWORD: ${{ secrets.JINDONOTE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$JINDONOTE_KEYSTORE_BASE64" && test -n "$JINDONOTE_KEYSTORE_PASSWORD" || { echo "Persistent signing secrets are required; release stopped."; exit 1; }
          printf '%s' "$JINDONOTE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jindonote-release.p12"
          chmod 600 "$RUNNER_TEMP/jindonote-release.p12"
          keytool -list -v -keystore "$RUNNER_TEMP/jindonote-release.p12" -storetype PKCS12 -storepass:env JINDONOTE_KEYSTORE_PASSWORD -alias jindonote > "$RUNNER_TEMP/cert-info.txt"
          grep -Fq 'A0:C8:E4:9B:C4:C1:E7:A2:B1:1C:4E:9A:32:09:A4:3C:4C:8A:7D:8C:8E:B8:CF:2F:77:28:18:8B:38:9B:27:BC' "$RUNNER_TEMP/cert-info.txt" || { echo "Signing certificate mismatch; release stopped."; exit 1; }
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/jindonote-release.p12")
                      storePassword System.getenv("JINDONOTE_KEYSTORE_PASSWORD")
                      keyAlias "jindonote"
                      keyPassword System.getenv("JINDONOTE_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          GRADLE
      - name: Build signed release APK
        if: github.ref == 'refs/heads/main'
        env:
          JINDONOTE_KEYSTORE_PASSWORD: ${{ secrets.JINDONOTE_KEYSTORE_PASSWORD }}
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleRelease
          mkdir -p ../apk-output
          cp app/build/outputs/apk/release/app-release.apk ../apk-output/jindonote.apk
      - name: Build debug APK for non-release branches
        if: github.ref != 'refs/heads/main'
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          mkdir -p ../apk-output
          cp app/build/outputs/apk/debug/app-debug.apk ../apk-output/jindonote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: class-progress-debug-apk
          path: apk-output/jindonote.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: class-progress-web-offline
          path: www/
          retention-days: 30

      - name: Publish downloadable APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" apk-output/jindonote.apk#jindonote.apk \
            --title "진도노트 APK 빌드 ${{ github.run_number }}" \
            --notes "고정 서명 키로 서명한 Android APK입니다. 새로운 서명 키로 처음 전환할 때 기존 앱 위에 설치되지 않을 수 있습니다. 기존 데이터는 반드시 백업하세요." \
            --latest


